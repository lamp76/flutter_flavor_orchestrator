name: example
description: Example Flutter app demonstrating flutter_flavor_orchestrator usage.
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_flavor_orchestrator:
    path: ../
  

flutter:
  uses-material-design: true

  assets:
    - assets/dev/
    - assets/staging/
    - assets/production/
    - assets/icons/dev/
    - assets/icons/staging/
    - assets/icons/production/
